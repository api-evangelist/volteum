aid: volteum
name: Volteum
description: Volteum provides fleet electrification and EV fleet management software
  that helps companies plan, execute, and operate the transition of their vehicle
  fleets to electric. The platform covers electrification planning, charging optimisation,
  and live fleet management, connecting directly to vehicles through OEM APIs across
  30+ brands with no hardware installation to track mileage, fault codes, charging
  sessions, maintenance intervals, and costs across electric, diesel, petrol, and
  hybrid fleets. Volteum is a Techstars portfolio company and publishes no public
  developer portal; its telematics and fleet-system API integrations are offered
  to customers directly.
